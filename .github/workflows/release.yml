name: Release

# Pushing a tag like v0.2.0:
#   1. runs the full test suite,
#   2. builds the app image for linux/amd64 (Intel N100, most servers) and linux/arm64 (Raspberry Pi, Apple silicon),
#   3. pushes it to ghcr.io/<owner>/family-memories as 0.2.0, 0.2 and latest,
#   4. publishes a GitHub Release with a ready-to-use compose file pinned to that exact image,
#      plus .env.example and the disaster-restore script.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/family-memories

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Family Memories
            org.opencontainers.image.description=Self-hosted family storytelling: guided prompts, voice and photo memories, family tree, website, PDF and book exports.

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          # The release compose file pulls the published image instead of building from source.
          sed -e '/^    build:$/,/^      context: \.$/d' \
              -e "s|\${APP_IMAGE:-[^}]*}|\${APP_IMAGE:-${IMAGE}}|" \
              -e "s|\${APP_VERSION:-latest}|\${APP_VERSION:-${VERSION}}|" \
              compose.yml > dist/compose.yml
          grep -q "image: \${APP_IMAGE:-${IMAGE}}:\${APP_VERSION:-${VERSION}}" dist/compose.yml
          ! grep -q "^    build:" dist/compose.yml
          cp dist/compose.yml dist/family-memories.yml   # OpenMediaVault Compose plugin naming
          cp .env.example dist/.env.example
          cp scripts/restore.sh dist/restore.sh
          mkdir -p dist/deploy/dev && cp deploy/dev/Caddyfile dist/deploy/dev/Caddyfile
          (cd dist && tar czf ../family-memories-${VERSION}-stack.tar.gz compose.yml family-memories.yml .env.example restore.sh deploy)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > notes.md <<EOF
          ## Install or upgrade

          \`\`\`sh
          docker pull ${IMAGE}:${VERSION}
          \`\`\`

          Download **compose.yml** (or **family-memories.yml** for OpenMediaVault) and **.env.example** below, then:

          \`\`\`sh
          cp .env.example .env   # fill it in (see the comments)
          docker compose up -d
          \`\`\`

          Upgrading: replace compose.yml with this release's copy (or set \`APP_VERSION=${VERSION}\`) and run \`docker compose pull && docker compose up -d\`. The app backs everything up before changing the database.

          Image: \`${IMAGE}:${VERSION}\` (linux/amd64, linux/arm64)
          EOF
          gh release create "$GITHUB_REF_NAME" --title "Family Memories ${VERSION}" --notes-file notes.md --generate-notes \
            dist/compose.yml dist/family-memories.yml dist/.env.example dist/restore.sh "family-memories-${VERSION}-stack.tar.gz"
