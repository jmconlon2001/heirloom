name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install ffmpeg (voice and video processing)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Unit and integration tests (Testcontainers PostgreSQL)
        run: dotnet test --project src/App.Tests -c Release --no-build

      - name: Install Playwright browsers and system dependencies
        run: pwsh src/App.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps webkit chromium

      - name: End-to-end tests (iPad WebKit, desktop Chromium, axe)
        run: dotnet test --project src/App.E2E -c Release --no-build

  image:
    name: Docker image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
