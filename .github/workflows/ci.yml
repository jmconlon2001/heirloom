name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:   # the release workflow runs the same tests first

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install ffmpeg, PostgreSQL 17 client, pandoc, poppler and restic
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg postgresql-client-17 pandoc poppler-utils
          curl -fsSL -o /tmp/restic.bz2 https://github.com/restic/restic/releases/download/v0.20.0/restic_0.20.0_linux_amd64.bz2
          echo "0ccd9fa7885074a24603b051e01bf9bd8b5e45d6a1791e9d9887e9e9372107f7  /tmp/restic.bz2" | sha256sum -c -
          bunzip2 -c /tmp/restic.bz2 | sudo tee /usr/local/bin/restic > /dev/null && sudo chmod 0755 /usr/local/bin/restic
          echo "PG_BIN_DIR=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Unit and integration tests (Testcontainers PostgreSQL)
        run: dotnet test --project src/App.Tests -c Release --no-build

      - name: Install Playwright browsers and system dependencies
        run: pwsh src/App.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps webkit chromium

      - name: End-to-end tests (iPad WebKit, desktop Chromium, axe)
        run: dotnet test --project src/App.E2E -c Release --no-build

  image:
    name: Docker image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: heirloom:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Fails the build on any HIGH or CRITICAL vulnerability that already has a fix (OS packages, .NET, restic).
      - name: Scan the image for known vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.69.3 \
            image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 heirloom:ci
